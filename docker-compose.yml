version: '3.8'

services:
  # Backend Flask
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - IA_HABILITADA=${IA_HABILITADA:-True}
      - BUSINESS_TYPE=${BUSINESS_TYPE:-services}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend:/app
      - ./backend/crm_whatsapp.db:/app/crm_whatsapp.db
    restart: unless-stopped
    networks:
      - crm-network

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - crm-network

  # WhatsApp Service (Node.js)
  whatsapp-service:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    container_name: crm-whatsapp-service
    ports:
      - "3001:3001"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:5000}
    volumes:
      - ./whatsapp-service:/app
      - ./tokens:/app/tokens
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge

volumes:
  db-data:
  tokens-data:

version: '3.8'

services:
  # ===== Backend Flask =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-whatsapp-backend
    restart: unless-stopped
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - DATABASE_NAME=/app/data/crm_whatsapp.db
      - WHATSAPP_SERVICE_URL=http://whatsapp-service:3001
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
      - crm-data:/app/data
      - crm-logs:/app/logs
    depends_on:
      - whatsapp-service
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== WhatsApp Service (Node.js + Baileys) =====
  whatsapp-service:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    container_name: crm-whatsapp-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${ENVIRONMENT:-production}
      - PORT=3001
    volumes:
      - ./whatsapp-service:/app
      - whatsapp-sessions:/app/auth_info_baileys
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== Frontend React/Vite =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-whatsapp-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===== PostgreSQL (Opcional - para produção) =====
